name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: TreadCore — tests Linux
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - name: swift test
        run: swift test --package-path TreadCore

  apple:
    name: Xcode — tests TreadCore + build iOS/watchOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Versions
        run: |
          xcodebuild -version
          swift --version
      - name: TreadCore — swift test (macOS)
        run: swift test --package-path TreadCore
      - name: Build iOS + Watch embarquée (simulateur)
        run: |
          status=0
          xcodebuild -project Foulee.xcodeproj -scheme Foulee \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO build > ios.log 2>&1 || status=$?
          grep -E "(error|warning): " ios.log | grep -v "^ld: warning" | sort -u | head -150 || true
          tail -n 3 ios.log
          exit $status
      - name: Vérifier l'app Watch embarquée dans l'app iPhone
        run: |
          APP=build/dd/Build/Products/Debug-iphonesimulator/Foulee.app
          W="$APP/Watch/FouleeWatch.app"
          test -d "$W" || { echo "App Watch absente de $APP/Watch"; ls -R "$APP" | head -40; exit 1; }
          for k in CFBundleIdentifier WKCompanionAppBundleIdentifier WKApplication CFBundleShortVersionString CFBundleVersion; do
            echo "Watch $k = $(/usr/libexec/PlistBuddy -c "Print :$k" "$W/Info.plist")"
          done
          echo "iPhone CFBundleIdentifier = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          test "$(/usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$W/Info.plist")" = \
               "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
      - name: Build watchOS (simulateur)
        run: |
          status=0
          xcodebuild -project Foulee.xcodeproj -scheme FouleeWatch \
            -destination 'generic/platform=watchOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build > watch.log 2>&1 || status=$?
          grep -E "(error|warning): " watch.log | grep -v "^ld: warning" | sort -u | head -150 || true
          tail -n 3 watch.log
          exit $status
      - name: Build iOS appareil (sans signature)
        run: |
          status=0
          xcodebuild -project Foulee.xcodeproj -scheme Foulee \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO build > device.log 2>&1 || status=$?
          grep -E "(error|warning): " device.log | grep -v "^ld: warning" | sort -u | head -150 || true
          tail -n 3 device.log
          exit $status
