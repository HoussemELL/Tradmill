name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-linux:
    name: TreadCore — tests Linux
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift test
        run: swift test --package-path TreadCore

  apple:
    name: Xcode — tests TreadCore + build iOS/watchOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Versions
        run: |
          xcodebuild -version
          swift --version
      - name: TreadCore — swift test (macOS)
        run: swift test --package-path TreadCore
      - name: Build iOS + Watch embarquée (simulateur)
        run: |
          set -o pipefail
          xcodebuild -project Foulee.xcodeproj -scheme Foulee \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ios.log | grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)" || true
          test "${PIPESTATUS[0]}" -eq 0 || { grep -E "error:" ios.log | sort -u | head -80; exit 1; }
      - name: Build watchOS (simulateur)
        run: |
          set -o pipefail
          xcodebuild -project Foulee.xcodeproj -scheme FouleeWatch \
            -destination 'generic/platform=watchOS Simulator' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee watch.log | grep -E "(error|warning):|BUILD (SUCCEEDED|FAILED)" || true
          test "${PIPESTATUS[0]}" -eq 0 || { grep -E "error:" watch.log | sort -u | head -80; exit 1; }
      - name: Build iOS appareil (sans signature)
        run: |
          set -o pipefail
          xcodebuild -project Foulee.xcodeproj -scheme Foulee \
            -destination 'generic/platform=iOS' -configuration Release \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee device.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test "${PIPESTATUS[0]}" -eq 0 || { grep -E "error:" device.log | sort -u | head -80; exit 1; }
